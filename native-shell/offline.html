<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tidak ada koneksi</title>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;
       background:linear-gradient(160deg,#0a6ebd,#2a8be0);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  .cat{font-size:72px;animation:bob 2.6s ease-in-out infinite}
  h1{margin:0;font-size:26px}
  p{margin:0;opacity:.9;max-width:300px;line-height:1.5}
  button{margin-top:10px;border:0;border-radius:999px;padding:16px 28px;font-size:17px;font-weight:700;background:#fff;color:#0a6ebd}
  @keyframes bob{50%{transform:translateY(-8px)}}
</style>
</head>
<body>
  <div class="cat">🐱💤</div>
  <h1>Lagi tidak ada internet</h1>
  <p>Mochi &amp; Boba menunggu sinyal. Cek Wi-Fi atau data seluler, lalu coba lagi.</p>
  <button onclick="location.href = (window.AIW_URL || '/') + '/'">Coba lagi</button>
  <script src="config.js"></script>
</body>
</html>
